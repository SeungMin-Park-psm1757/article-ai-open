name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows-base.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_test.py
      - run: python scripts/check_release.py
      - run: python scripts/check_docs.py
      - name: Check hardware diagnostic output
        shell: pwsh
        run: |
          $result = ./scripts/doctor.ps1 | ConvertFrom-Json
          if ($result.schema -ne 'article-ai-doctor/1' -or $result.profile -ne 'UNVERIFIED' -or $result.disk_bytes.free -le 0) { throw 'Invalid diagnostic output' }
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r requirements-windows-base.lock
      - run: pip-audit --disable-pip --no-deps -r requirements-windows-ai.lock
